name: '💡 Feature Request'
description: Create a new ticket for a new feature request
title: '💡 Enhancement - '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        ### 🤖 Automated Branch Creation

        When you submit this feature request, GitHub Actions will **automatically create a branch** in the format `feature/issue-{NUMBER}-{slug}` and post a comment with the branch link. You don't need to create the branch manually!

        See [CONTRIBUTING.md](../../CONTRIBUTING.md) for the full workflow.
  - type: input
    id: start_date
    attributes:
      label: 'Start Date (Dev only)'
      description: Start of development (leave blank until started)
      placeholder: 'month/day/year'
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: Provide a brief explanation of the feature
      placeholder: Describe in a few lines your feature request
    validations:
      required: true
  - type: textarea
    id: basic_example
    attributes:
      label: 'Basic Example'
      description: Indicate here some basic examples of your feature.
      placeholder: A few specific words about your feature request.
    validations:
      required: true
  - type: textarea
    id: drawbacks
    attributes:
      label: 'Drawbacks'
      description: What are the drawbacks/impacts of your feature request ?
      placeholder: Identify the drawbacks and impacts while being neutral on your feature request
    validations:
      required: true
  - type: textarea
    id: unresolved_question
    attributes:
      label: 'Unresolved questions'
      description: What questions still remain unresolved ?
      placeholder: Identify any unresolved issues.
    validations:
      required: false
  - type: textarea
    id: implementation_pr
    attributes:
      label: 'Implementation PR (Dev only)'
      description: Pull request used (leave blank until PR created)
      placeholder: '#Pull Request ID'
    validations:
      required: false
  - type: textarea
    id: reference_issues
    attributes:
      label: 'Reference Issues (Dev only)'
      description: Common issues
      placeholder: '#Issues IDs'
    validations:
      required: false
