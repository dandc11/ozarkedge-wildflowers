name: Create Branch on Issue

# Manual-only (#302): branches used to auto-create on issue open, but that meant
# the fork point went stale for anything that sat in the backlog before pickup.
# Branches are now created at pickup time instead (see
# .claude/skills/github-issue-and-branch-workflow/SKILL.md). This workflow is
# kept as a manual escape hatch via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to create branch for
        required: true

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Create branch and comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt(context.payload.inputs?.issue_number);

            if (!issueNumber) {
              core.setFailed('Could not determine issue number');
              return;
            }

            const { owner, repo } = context.repo;

            // Fetch issue to get title
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber
            });

            // Generate branch slug from title
            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9 ]/g, '')
              .trim()
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-')
              .slice(0, 40)
              .replace(/-$/, '');

            const branchName = `feature/issue-${issueNumber}-${slug}`;

            // Get SHA of main
            const { data: mainRef } = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main'
            });
            const sha = mainRef.object.sha;

            // Check if branch already exists
            let branchExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branchName}` });
              branchExists = true;
            } catch (e) {
              // 404 = doesn't exist, that's expected
            }

            if (branchExists) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: [
                  `Branch already exists: \`${branchName}\``,
                  '',
                  'To get started:',
                  '```bash',
                  'git fetch origin',
                  `git checkout ${branchName}`,
                  '```'
                ].join('\n')
              });
              return;
            }

            // Create the branch
            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/heads/${branchName}`,
              sha
            });

            // Comment on the issue
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                `Branch created: \`${branchName}\``,
                '',
                'To get started:',
                '```bash',
                'git fetch origin',
                `git checkout ${branchName}`,
                '```',
                '',
                'When ready to open a PR, use this title format:',
                '```',
                `Closes #${issueNumber}: your description here`,
                '```'
              ].join('\n')
            });

  # Fail loudly (#287): if the job above fails, de-dupe onto a single open
  # [automation-failure] tracker issue. Uses the built-in GITHUB_TOKEN.
  notify-failure:
    needs: create-branch
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the automation-failure tracker issue
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '[automation-failure]';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `⚠️ **${context.workflow}** failed (event: \`${context.eventName}\`).`,
              '',
              `Run: ${runUrl}`,
              '',
              'Often a token/permission problem. If the run log shows `Bad credentials`, a PAT secret (e.g. `ADD_TO_PROJECT_PAT`) has expired — rotate it (classic PAT, `repo` + `project` scopes), update the repo secret, then re-run the failed runs. Otherwise check the run log.',
              '',
              'cc @dandc11',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const tracker = issues.find((i) => !i.pull_request && i.title.includes(marker));
            if (tracker) {
              await github.rest.issues.createComment({ owner, repo, issue_number: tracker.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `${marker} token-dependent automation failure`,
                body,
              });
            }
