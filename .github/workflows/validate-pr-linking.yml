name: 'Validate PR Linking'

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  validate-pr-linking:
    name: Validate PR is linked to issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate issue number
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔍 Validating PR #$PR_NUMBER linking..."
          echo ""
          echo "Branch: $BRANCH_NAME"
          echo "PR Title: $PR_TITLE"

          # Validate the branch shape and extract the issue number.
          # Accepts an optional `claude/` provenance prefix (Claude-authored
          # branches) and a {feature,research,fix} type — group 3 is the number.
          # Because `enforce-branch-naming` only skips the harness scratch shape
          # (`claude/<slug>`), this PR-time check is a strict backstop for any
          # branch that reached a PR: shape here, issue existence just below.
          if ! [[ "$BRANCH_NAME" =~ ^(claude/)?(feature|research|fix)/issue-([0-9]+) ]]; then
            echo "❌ Could not extract issue number from branch name"
            echo "Branch should follow format: {type}/issue-{NUMBER}-{slug}"
            echo "  {type} ∈ {feature, research, fix}; optionally prefixed with claude/"
            echo "Your branch: $BRANCH_NAME"
            exit 1
          fi

          ISSUE_NUMBER_FROM_BRANCH="${BASH_REMATCH[3]}"
          echo "ℹ️  Issue number from branch: #$ISSUE_NUMBER_FROM_BRANCH"

          # Verify the referenced issue actually exists (mirrors enforce-branch-naming).
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          ISSUE_DATA=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$OWNER/$REPO_NAME/issues/$ISSUE_NUMBER_FROM_BRANCH")
          if echo "$ISSUE_DATA" | grep -q '"message": "Not Found"'; then
            echo "❌ Issue #$ISSUE_NUMBER_FROM_BRANCH (from the branch name) does not exist"
            exit 1
          fi
          echo "✅ Issue #$ISSUE_NUMBER_FROM_BRANCH exists"

          # Check if PR title contains "Closes #NUM" or "Fixes #NUM"
          if [[ "$PR_TITLE" =~ [Cc]loses\ #([0-9]+) ]]; then
            ISSUE_NUMBER_FROM_TITLE="${BASH_REMATCH[1]}"
            echo "ℹ️  Issue number from PR title: #$ISSUE_NUMBER_FROM_TITLE"

            # Verify they match
            if [ "$ISSUE_NUMBER_FROM_BRANCH" != "$ISSUE_NUMBER_FROM_TITLE" ]; then
              echo ""
              echo "❌ MISMATCH: Branch references issue #$ISSUE_NUMBER_FROM_BRANCH but PR title references #$ISSUE_NUMBER_FROM_TITLE"
              echo ""
              echo "Fix this by updating your PR title to:"
              echo "  Closes #$ISSUE_NUMBER_FROM_BRANCH: <description>"
              exit 1
            fi
          elif [[ "$PR_TITLE" =~ [Ff]ixes\ #([0-9]+) ]]; then
            ISSUE_NUMBER_FROM_TITLE="${BASH_REMATCH[1]}"
            echo "ℹ️  Issue number from PR title: #$ISSUE_NUMBER_FROM_TITLE"

            if [ "$ISSUE_NUMBER_FROM_BRANCH" != "$ISSUE_NUMBER_FROM_TITLE" ]; then
              echo ""
              echo "❌ MISMATCH: Branch references issue #$ISSUE_NUMBER_FROM_BRANCH but PR title references #$ISSUE_NUMBER_FROM_TITLE"
              echo ""
              echo "Fix this by updating your PR title to:"
              echo "  Fixes #$ISSUE_NUMBER_FROM_BRANCH: <description>"
              exit 1
            fi
          else
            echo ""
            echo "❌ PR title must reference the issue"
            echo ""
            echo "Update your PR title to start with one of:"
            echo "  - Closes #$ISSUE_NUMBER_FROM_BRANCH: <description>"
            echo "  - Fixes #$ISSUE_NUMBER_FROM_BRANCH: <description>"
            exit 1
          fi

          echo ""
          echo "✅ PR title correctly references issue #$ISSUE_NUMBER_FROM_BRANCH"

      - name: Auto-link PR to issue (if not already linked)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prNumber = context.issue.number;

            // Extract issue number from branch
            const match = branch.match(/issue-(\d+)/);
            if (!match) return;

            const issueNumber = parseInt(match[1]);

            // Check if PR is already linked to an issue
            const pr = context.payload.pull_request;
            if (pr && pr.body && pr.body.includes(`#${issueNumber}`)) {
              console.log(`✅ PR #${prNumber} is already linked to issue #${issueNumber}`);
              return;
            }

            console.log(`🔗 Auto-linking PR #${prNumber} to issue #${issueNumber}`);

            // The PR is automatically linked by GitHub when the title contains "Closes #NUM"
            // This step is here for documentation/logging purposes
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['ready-for-review']
            }).catch(() => {
              // Label might not exist, that's okay
            });
