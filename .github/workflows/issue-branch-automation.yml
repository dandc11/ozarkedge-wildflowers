name: Auto-Create Issue Branch

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to create branch for
        required: true
        type: string

jobs:
  create-branch:
    name: Create branch from issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Fetch issue title from API if empty (e.g. workflow_dispatch)
          if [ -z "$ISSUE_TITLE" ]; then
            ISSUE_TITLE=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.title')
            echo "Fetched issue title from API: $ISSUE_TITLE"
          fi

          # Generate slug: lowercase, alphanumeric + hyphens only, max 40 chars
          SLUG=$(echo "$ISSUE_TITLE" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9 ]//g' | \
            sed 's/ /-/g' | \
            sed 's/-\+/-/g' | \
            sed 's/^-//;s/-$//' | \
            cut -c1-40)

          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}-${SLUG}"
          echo "Branch name: $BRANCH_NAME"

          # Skip if branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            echo "Branch already exists: $BRANCH_NAME"
            gh issue comment "$ISSUE_NUMBER" --body "Branch already exists: \`${BRANCH_NAME}\`

To get started:
\`\`\`bash
git fetch origin
git checkout $BRANCH_NAME
\`\`\`"
            exit 0
          fi

          # Create branch from main and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"

          # Comment on the issue
          gh issue comment "$ISSUE_NUMBER" --body "Branch created: \`${BRANCH_NAME}\`

To get started:
\`\`\`bash
git fetch origin
git checkout $BRANCH_NAME
\`\`\`

When ready to open a PR, use this title format:
\`\`\`
Closes #${ISSUE_NUMBER}: your description here
\`\`\`"

      - name: Assign issue to opener
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.issue.user.login }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-assignee "$ASSIGNEE"
